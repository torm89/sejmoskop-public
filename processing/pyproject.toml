[tool.poetry]
name = "processing"
version = "0.1.0"
description = ""
authors = ["Tomasz Ryczkowski <tomaszrycz@gmail.com>"]
readme = "README.md"
packages = [{include = "processing"}]

[tool.poetry.dependencies]
python = "^3.9"
aiobotocore = {extras = ["awscli", "boto3"], version = "^2.9.0"}
pyathena = {extras = ["sqlalchemy"], version = "^3.0.10"}
awslambdaric = "^2.0.8"
pandas = "^2.1.4"
pydantic = "^2.5.3"
numpy = "^1.26.2"
requests = "^2.31.0"
opensearch-py = "^2.4.2"
cachetools = "^5.3.2"
morfeusz2 = "^1.99.8"
httpx = "^0.26.0"
regex = "^2023.12.25"


[tool.poetry.group.test.dependencies]
pytest = "^7.4.3"
coverage = "^7.3.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

